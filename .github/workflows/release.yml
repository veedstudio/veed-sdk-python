# Code generated from the VEED OpenAPI spec. DO NOT EDIT.

name: Release

# The tag is the release: it is pushed only after the SDK factory has already
# run this SDK's suite against freshly rendered output.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: PyPI publish
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history of every branch: the ancestry check below needs the tag
          # and main to share one, and this is what leaves origin/main behind.
          fetch-depth: 0
          persist-credentials: false
      # Full version: setup-uv publishes no floating major tag past v7.
      - uses: astral-sh/setup-uv@v9.0.0
      # Matching the manifest to the tag name proves nothing about the tree.
      - name: Check the tag is on main
        run: |
          set -euo pipefail
          # No fetch: checkout dropped its credentials, and the refs are here.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} is not on main; refusing to publish"
            exit 1
          fi
      - name: Check pyproject.toml matches the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "::error::pyproject.toml says $version, tag says $tag"
            exit 1
          fi
      - run: uv build
      - run: uv publish --trusted-publishing always
